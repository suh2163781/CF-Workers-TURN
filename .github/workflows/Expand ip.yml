name: Turn Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'  # 每月自动跑，不需要可删掉

permissions:
  contents: write   # 发布 release 需要写权限

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build -o turn_scan .

      - name: Run scan
        run: |
          ./turn_scan \
            -c 100 \
            -p 500 \
            -pt 3 \
            -t 5 \
            -ct 8 \
            ip_list.txt

      - name: Add turn:// prefix to results
        run: |
          # 给每一行非空内容加上 turn:// 前缀（如果已经有前缀则跳过）
          sed -i -E 's#^([^t]|t[^u]|tu[^r]|tur[^n])#turn://\1#' turn_results.txt || true
          # 更稳妥的写法：直接对不以 turn:// 开头的行加前缀
          awk '{
            if ($0 !~ /^turn:\/\//) {
              print "turn://" $0
            } else {
              print $0
            }
          }' turn_results.txt > turn_results.tmp && mv turn_results.tmp turn_results.txt

      - name: Set release tag
        id: vars
        run: echo "tag=scan-$(date -u '+%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add turn_results.txt
          git diff --cached --quiet || git commit -m "update scan result $(date '+%Y-%m-%d %H:%M:%S')"
          git push

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Turn Scan ${{ steps.vars.outputs.tag }}"
          files: turn_results.txt
          body: "自动扫描结果，生成时间 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
