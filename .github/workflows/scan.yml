name: Turn Scan
on:
  workflow_dispatch:
  push:
    branches:
      - main        
    paths:
      - 'ip_list.txt'
    paths-ignore:
      - 'turn_results.txt'   
  schedule:
    - cron: '0 0 1 * *'  # 每月自动跑，不需要可删掉

permissions:
  contents: write
  actions: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: turn-scan
  cancel-in-progress: true   

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build -o turn_scan .

      - name: Run scan
        run: |
          ./turn_scan \
            -c 100 \
            -p 500 \
            -pt 3 \
            -t 5 \
            -ct 8 \
            ip_list.txt

      - name: Add turn:// prefix to results
        run: |
          if [ ! -s turn_results.txt ]; then
            echo "警告: turn_results.txt 为空或不存在，跳过后续步骤"
            exit 0
          fi
          awk '{
            if ($0 !~ /^turn:\/\//) {
              print "turn://" $0
            } else {
              print $0
            }
          }' turn_results.txt > turn_results.tmp && mv turn_results.tmp turn_results.txt

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add turn_results.txt
          git diff --cached --quiet || git commit -m "update scan result $(date '+%Y-%m-%d %H:%M:%S')"

          # 推送前先同步远端，避免 rejected 冲突
          git pull --rebase origin main || {
            echo "rebase 冲突，改为用本地这次结果覆盖提交"
            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add turn_results.txt
            git commit -m "update scan result $(date '+%Y-%m-%d %H:%M:%S') (resolved)" --allow-empty
          }

          git push origin HEAD:main

      - name: Publish to Releases (overwrite latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Turn Scan Latest"
          files: turn_results.txt
          body: "自动扫描结果，生成时间 ${{ github.run_started_at }}"

      - name: Clean up old workflow runs (all workflows, keep latest each)
        run: |
          WORKFLOW_IDS=$(gh api "repos/${{ github.repository }}/actions/workflows" \
            --jq '.workflows[].id')

          for wf_id in $WORKFLOW_IDS; do
            echo "=== 处理 workflow ID: $wf_id ==="

            RUN_IDS=$(gh api "repos/${{ github.repository }}/actions/workflows/${wf_id}/runs?per_page=100" \
              --jq '.workflow_runs[].id')

            COUNT=0
            for id in $RUN_IDS; do
              COUNT=$((COUNT+1))
              if [ "$COUNT" -eq 1 ]; then
                echo "保留最新记录: $id"
                continue
              fi
              echo "删除旧记录: $id"
              gh run delete "$id" || true
            done
          done
